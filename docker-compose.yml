services:
  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8888:8888"
      - "5000:5000"
    volumes:
      - a1-data:/app/data
      - ./packages:/app/packages
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
    env_file:
      - .env
    restart: "no"
    cpus: 10

volumes:
  a1-data:
    name: a1-data
